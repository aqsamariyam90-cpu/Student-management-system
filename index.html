<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Student Management System</h1>
        <form id="studentForm">
            <input type="text" id="name" placeholder="Enter student name" required>
            <input type="number" id="age" placeholder="Enter age" min="1" required>
            <input type="text" id="course" placeholder="Enter course" required>
            <button type="submit" id="submitBtn">Add Student</button>
        </form>
        <h2>Student Records</h2>
        <p id="message"></p>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Age</th>
                        <th>Course</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="studentList">
                    <!-- Students JavaScript se yahan show honge -->
                </tbody>
            </table>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
